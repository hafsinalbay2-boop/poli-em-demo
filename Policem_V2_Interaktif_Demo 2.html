<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143b6b"><title>Poliçem V2 Demo</title><style>
:root{--primary:#1755a2;--bg:#f3f6fb;--card:#fff;--text:#172338;--muted:#68758a;--line:#dce4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{background:var(--primary);color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;display:flex;justify-content:space-between;align-items:center}header b{font-size:21px}.app{max-width:1100px;margin:auto}.content{padding:20px 16px 100px}h2{font-size:23px;margin:4px 0 16px}h3{font-size:17px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 3px 12px #16355c09}.tile{text-align:left;min-height:108px;border:1px solid var(--line);background:white;border-radius:17px;padding:17px;color:var(--text)}.tile .emoji{font-size:27px;display:block;margin-bottom:10px}.metric{font-size:30px;font-weight:750;color:var(--primary);margin:8px 0 3px}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--primary);color:white;font-weight:650}.btn.secondary{background:#e7effa;color:#154d94}.btn.danger{background:#fff1f1;color:#ad2b36}.btn:disabled{opacity:.5}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stack{display:grid;gap:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filters select,.filters input{flex:1;min-width:125px}input,select{width:100%;border:1px solid #cdd8e7;border-radius:11px;background:white;padding:12px;color:var(--text)}label{font-weight:600;font-size:13px;display:grid;gap:6px}small{font-size:12px;color:var(--muted)}.pill{display:inline-block;background:#e8f0fc;color:#19539c;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:650}.item{border-top:1px solid var(--line);padding:13px 0}.item:first-child{border:0}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 2px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;font-size:11px;color:var(--muted);display:grid;gap:4px;justify-items:center}.nav button span{font-size:21px}.nav .selected{color:var(--primary);font-weight:700}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%)}.login h1{color:var(--primary);font-size:32px;margin:4px 0}.note{background:#fff7e8;border:1px solid #f5dda6;border-radius:12px;padding:12px;font-size:13px;color:#75531b}.hidden{display:none!important}.back{background:none;border:0;color:var(--primary);padding:0 0 15px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}.file{border:2px dashed #afc6e6;padding:20px;text-align:center;border-radius:14px;background:#f7faff}.file input{border:0;padding:5px}.wide{width:100%}body[data-theme=green]{--primary:#117f68}body[data-theme=purple]{--primary:#6949a9}@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{max-width:1100px;margin:auto;left:0;right:0}.content{padding:30px 25px 120px}}
</style></head><body><div id="root"></div><script>
const initial=[{id:1,name:'Ahmet Yılmaz',type:'Kasko',agency:'Merkez',owner:'Ayşe Kaya',uploader:'Ayşe Kaya',amount:18750,start:'2026-02-10',end:'2027-02-10',status:'Aktif',follow:true},{id:2,name:'Elif Demir',type:'DASK',agency:'Kadıköy',owner:'Mehmet Arslan',uploader:'Mehmet Arslan',amount:2340,start:'2025-10-25',end:'2026-10-25',status:'Bekliyor',follow:true},{id:3,name:'Can Özkan',type:'Konut',agency:'Merkez',owner:'Ayşe Kaya',uploader:'Ayşe Kaya',amount:5600,start:'2025-10-21',end:'2026-10-21',status:'Arandı',follow:true},{id:4,name:'Zeynep Acar',type:'TSS',agency:'Beşiktaş',owner:'Mehmet Arslan',uploader:'Mehmet Arslan',amount:12900,start:'2026-10-08',end:'2027-10-08',status:'Teklif Yapıldı',follow:true},{id:5,name:'Deniz Koç',type:'Trafik',agency:'Merkez',owner:'Ayşe Kaya',uploader:'Ayşe Kaya',amount:9600,start:'2025-10-15',end:'2026-10-15',status:'Poliçeleştirildi',follow:true}];
let data=JSON.parse(localStorage.getItem('policem_v2_data')||'null')||initial;let people=JSON.parse(localStorage.getItem('policem_v2_people')||'null')||['Ayşe Kaya','Mehmet Arslan','Selin Ak'];let agencies=JSON.parse(localStorage.getItem('policem_v2_agencies')||'null')||['Merkez','Kadıköy','Beşiktaş'];let role=sessionStorage.getItem('policem_v2_role')||'';let page='home',category='Aktif',period='all',policyType='all',staff='all',staffPeriod='all',staffType='all',selected=null,uploadRows=[];const root=document.getElementById('root');const today=new Date('2026-10-14T12:00:00');const types=['Kasko','Trafik','DASK','Konut','TSS','Sağlık','İşyeri','Diğer'];const statuses=['Bekliyor','Arandı','Teklif Yapıldı','Poliçeleştirildi','Kaybedildi'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0});const save=()=>{localStorage.setItem('policem_v2_data',JSON.stringify(data));localStorage.setItem('policem_v2_people',JSON.stringify(people));localStorage.setItem('policem_v2_agencies',JSON.stringify(agencies))};const days=d=>Math.ceil((new Date(d+'T12:00:00')-today)/86400000);const within=(date,p)=>{if(p==='all')return true;let d=new Date(date+'T12:00:00');let diff=Math.floor((today-d)/86400000);if(p==='day')return diff===0;if(p==='week')return diff>=0&&diff<7;if(p==='month')return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth();if(p==='year')return d.getFullYear()===today.getFullYear();return true};const periodSelect=(v,fn)=>`<select onchange="${fn}(this.value)"><option value="all" ${v==='all'?'selected':''}>Tüm zamanlar</option>${[['year','Yıl'],['month','Ay'],['week','Hafta'],['day','Gün']].map(([x,t])=>`<option value="${x}" ${v===x?'selected':''}>${t}</option>`).join('')}</select>`;const typeSelect=(v,fn)=>`<select onchange="${fn}(this.value)"><option value="all">Tüm poliçe türleri</option>${types.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`;
function subset(cat){return data.filter(p=>{let d=days(p.end);if(cat==='Aktif')return d>=0&&p.status!=='Kaybedildi';if(cat==='Yaklaşan')return d>=0&&d<=15&&p.follow&& !['Poliçeleştirildi','Kaybedildi'].includes(p.status);if(cat==='Teklif')return ['Teklif Yapıldı','Arandı','Bekliyor'].includes(p.status);if(cat==='Kesilen')return p.status==='Poliçeleştirildi'||p.status==='Aktif';return true})}function filtered(cat){return subset(cat).filter(p=>(policyType==='all'||p.type===policyType)&&within(cat==='Kesilen'?p.start:cat==='Yaklaşan'?p.end:p.start,period))}function go(p){page=p;selected=null;render();scrollTo(0,0)}function categoryGo(c){category=c;policyType='all';page='list';render();scrollTo(0,0)}function login(){let u=document.getElementById('user').value.trim(),p=document.getElementById('password').value;if(!u||!p){alert('Kullanıcı adı ve şifre giriniz.');return}role=document.getElementById('role').value;sessionStorage.setItem('policem_v2_role',role);go('home')}function logout(){role='';sessionStorage.removeItem('policem_v2_role');render()}
function render(){if(!role){root.innerHTML=`<div class="login"><div class="card stack"><div style="font-size:36px">🛡️</div><h1>Poliçem</h1><div class="muted">V2 · İnteraktif prototip</div><label>Kullanıcı adı<input id="user" placeholder="Örn. yonetici" autocomplete="username"></label><label>Şifre<input id="password" type="password" placeholder="Herhangi bir demo şifresi"></label><label>Demo rolü<select id="role"><option value="partner">Ortak / Yönetici</option><option value="manager">Şube yöneticisi</option><option value="staff">Personel</option></select></label><button class="btn wide" onclick="login()">Giriş Yap</button><div class="note">Bu ekran gerçek kimlik doğrulaması yapmaz. Demo şifresi herhangi bir değer olabilir; gerçek müşteri verisi girmeyin.</div></div></div>`;return}let title={home:'Ana Sayfa',summary:'Yönetici Özeti',list:category+' Poliçeler',staff:'Personel Takip',org:'Acente Yönetimi',settings:'Ayarlar',upload:'Poliçe Ekle',renew:'Vade Takibi',detail:'Poliçe Detayı'}[page];root.innerHTML=`<div class="app"><header><b>🛡️ Poliçem</b><div style="text-align:right;font-size:12px">${role==='partner'?'Ortak':role==='manager'?'Şube yöneticisi':'Personel'}<br><a style="color:white;text-decoration:underline" onclick="logout()">Çıkış</a></div></header><main class="content">${page==='home'?home():page==='summary'?summary():page==='list'?list():page==='staff'?staffPage():page==='org'?org():page==='settings'?settings():page==='upload'?upload():page==='renew'?renew():page==='detail'?detail():''}</main><nav class="nav">${[['home','🏠','Ana Sayfa'],['summary','📊','Özet'],['upload','📄','Poliçe Ekle'],['renew','🔔','Vadeler'],['settings','⚙️','Ayarlar']].map(([p,e,n])=>`<button class="${page===p?'selected':''}" onclick="go('${p}')"><span>${e}</span>${n}</button>`).join('')}</nav></div>`}
function home(){let items=[['summary','📊','Yönetici Özeti'],['staff','👥','Personel Takip'],['org','🏢','Acente Ekle / Çıkar'],['settings','⚙️','Ayarlar'],['upload','📄','Poliçe Ekle'],['renew','🔔','Vade Takibi']];if(role==='staff')items=items.filter(x=>!['staff','org'].includes(x[0]));return `<h2>Hoş geldiniz</h2><p class="muted">Gitmek istediğiniz bölümü seçin.</p><div class="grid">${items.map(([p,e,n])=>`<button class="tile" onclick="go('${p}')"><span class="emoji">${e}</span><b>${n}</b></button>`).join('')}</div><p class="note" style="margin-top:16px">Demo verileri temsili. Yüklemeler ve değişiklikler yalnızca bu tarayıcıda saklanır.</p>`}
function summary(){let cats=[['Aktif','Aktif Poliçeler'],['Yaklaşan','Yaklaşan Poliçeler'],['Teklif','Teklif Aşamasında'],['Kesilen','Kesilen Poliçeler']];return `<h2>Yönetici Özeti</h2><div class="filters">${periodSelect(period,'setPeriod')}</div><div class="grid">${cats.map(([c,n])=>`<button class="tile" onclick="categoryGo('${c}')"><small>${n}</small><div class="metric">${subset(c).filter(p=>within(c==='Yaklaşan'?p.end:p.start,period)).length}</div><span class="muted">Listeyi görüntüle →</span></button>`).join('')}</div><p class="muted" style="margin-top:15px">Aktif: vadesi geçmemiş kayıtlar. Kesilen: üretim kaydı. Kategoriler birbiriyle kesişebilir.</p>`}
function setPeriod(x){period=x;render()}function setType(x){policyType=x;render()}function list(){let rows=filtered(category);return `<button class="back" onclick="go('summary')">← Yönetici Özeti</button><h2>${esc(category)} Poliçeler</h2><div class="filters">${periodSelect(period,'setPeriod')}${typeSelect(policyType,'setType')}</div><div class="card"><div class="row"><b>${rows.length} poliçe</b><span class="muted">Tür filtresi uygulanabilir</span></div>${rows.length?rows.map(p=>policyItem(p)).join(''):'<p class="muted">Bu filtreye uygun poliçe yok.</p>'}</div>`}
function policyItem(p){return `<div class="item"><div class="row"><b>${esc(p.name)}</b><span class="pill">${esc(p.type)}</span></div><div class="muted">${esc(p.agency)} · ${esc(p.owner)} · ${money(p.amount)}</div><div class="row"><small>Vade: ${esc(p.end)} · ${esc(p.status)}</small><button class="btn secondary" onclick="showDetail(${p.id})">Detay</button></div></div>`}function showDetail(id){selected=id;page='detail';render()}function detail(){let p=data.find(x=>x.id===selected);if(!p)return '<p>Kayıt bulunamadı.</p>';return `<button class="back" onclick="go('summary')">← Geri</button><h2>${esc(p.name)}</h2><div class="card stack">${[['Poliçe türü',p.type],['Acente',p.agency],['Poliçe kimin',p.owner],['Yükleyen',p.uploader],['Başlangıç',p.start],['Bitiş',p.end],['Tutar',money(p.amount)],['Vade takip',p.follow?'Evet':'Hayır']].map(([k,v])=>`<div class="row"><span class="muted">${k}</span><b>${esc(v)}</b></div>`).join('')}<label>Yenileme durumu<select onchange="changeStatus(${p.id},this.value)">${['Aktif',...statuses].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></label></div>`}function changeStatus(id,v){data.find(x=>x.id===id).status=v;save();render()}
function staffPage(){if(role==='staff')return '<h2>Yetki yok</h2>';let rows=data.filter(p=>(staff==='all'||p.owner===staff)&&(staffType==='all'||p.type===staffType)&&within(p.start,staffPeriod));let cut=rows.filter(p=>['Aktif','Poliçeleştirildi'].includes(p.status));let working=rows.filter(p=>['Bekliyor','Arandı','Teklif Yapıldı'].includes(p.status));return `<h2>Personel Takip</h2><div class="filters"><select onchange="staff=this.value;render()"><option value="all">Tüm personel</option>${people.map(x=>`<option ${staff===x?'selected':''}>${esc(x)}</option>`).join('')}</select>${periodSelect(staffPeriod,'setStaffPeriod')}${typeSelect(staffType,'setStaffType')}</div><div class="grid">${[['Toplam poliçe tutarı',money(rows.reduce((s,p)=>s+p.amount,0))],['Toplam poliçe adedi',rows.length],['Çalışılan poliçe adedi',working.length],['Kesilen poliçe adedi',cut.length]].map(([n,v])=>`<div class="card"><small>${n}</small><div class="metric" style="font-size:24px">${v}</div></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Personel poliçeleri</h3>${rows.map(policyItem).join('')||'<p class="muted">Kayıt yok.</p>'}</div><p class="muted">Toplam tutar bu prototipte kayıtlı poliçe tutarlarının toplamıdır; prim/komisyon ayrımı henüz uygulanmadı.</p>`}function setStaffPeriod(x){staffPeriod=x;render()}function setStaffType(x){staffType=x;render()}
function org(){if(role==='staff')return '<h2>Yetki yok</h2>';return `<h2>Acente Ekle / Çıkar</h2><div class="stack"><div class="card stack"><h3>Şube / Acente</h3>${agencies.map(x=>`<div class="row"><b>${esc(x)}</b><button class="btn danger" onclick="removeAgency('${encodeURIComponent(x)}')">Çıkar</button></div>`).join('')}<div class="row"><input id="agencyName" placeholder="Yeni şube / acente adı"><button class="btn" onclick="addAgency()">Ekle</button></div></div><div class="card stack"><h3>Personel</h3>${people.map(x=>`<div class="row"><b>${esc(x)}</b><button class="btn danger" onclick="removePerson('${encodeURIComponent(x)}')">Çıkar</button></div>`).join('')}<div class="row"><input id="personName" placeholder="Yeni personel"><button class="btn" onclick="addPerson()">Ekle</button></div></div></div><p class="muted">Bu demo silme işlemlerinde poliçe geçmişini korumak için bağlı personel/acentenin kaldırılmasını engeller.</p>`}function addAgency(){let x=document.getElementById('agencyName').value.trim();if(x&&!agencies.includes(x)){agencies.push(x);save();render()}}function addPerson(){let x=document.getElementById('personName').value.trim();if(x&&!people.includes(x)){people.push(x);save();render()}}function removeAgency(x){x=decodeURIComponent(x);if(data.some(p=>p.agency===x))return alert('Bu acenteye bağlı poliçeler var. Önce devretmeniz gerekir.');agencies=agencies.filter(a=>a!==x);save();render()}function removePerson(x){x=decodeURIComponent(x);if(data.some(p=>p.owner===x))return alert('Bu personele bağlı poliçeler var. Önce sorumluluk devri gerekir.');people=people.filter(a=>a!==x);save();render()}
function settings(){return `<h2>Ayarlar</h2><div class="card stack"><label>Uygulama rengi<select onchange="document.body.dataset.theme=this.value;localStorage.setItem('policem_v2_theme',this.value)"><option value="blue">Mavi</option><option value="green" ${document.body.dataset.theme==='green'?'selected':''}>Yeşil</option><option value="purple" ${document.body.dataset.theme==='purple'?'selected':''}>Mor</option></select></label><label>Şifre değiştir<input type="password" placeholder="Yeni şifre (demo)"></label><button class="btn secondary" onclick="alert('Demo: Şifre değişikliği gerçek bir hesap sistemine bağlı değil.')">Şifreyi Değiştir</button><button class="btn danger" onclick="if(confirm('Demo verileri sıfırlansın mı?')){localStorage.removeItem('policem_v2_data');localStorage.removeItem('policem_v2_people');localStorage.removeItem('policem_v2_agencies');location.reload()}">Demo Verilerini Sıfırla</button></div>`}
function upload(){return `<h2>Poliçe Ekle</h2><div class="card stack"><div class="note">Tekli veya çoklu PDF seçebilirsiniz. Bu demoda PDF içeriği okunmaz; her dosyanın bilgilerini elle kontrol ederek kaydedebilirsiniz.</div><label>Poliçe kimin? *<select id="owner"><option value="">Seçiniz</option>${people.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Hangi acente? *<select id="agency"><option value="">Seçiniz</option>${agencies.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Vade takip mi? (isteğe bağlı)<select id="follow"><option value="">Belirtilmedi</option><option value="yes">Evet</option><option value="no">Hayır</option></select></label><div class="file"><b>PDF dosyalarını seçin</b><p class="muted">Bir veya birden fazla PDF</p><input type="file" accept="application/pdf,.pdf" multiple onchange="filesSelected(this.files)"></div><div id="uploadRows">${uploadRows.map((r,i)=>uploadEditor(r,i)).join('')}</div>${uploadRows.length?'<button class="btn wide" onclick="saveUploads()">'+uploadRows.length+' Poliçeyi Kaydet</button>':''}</div>`}
function filesSelected(files){uploadRows=[...files].filter(f=>f.name.toLowerCase().endsWith('.pdf')).map(f=>({file:f.name,name:'',type:'Kasko',amount:'',start:'2026-10-14',end:'2027-10-14'}));render()}function uploadEditor(r,i){return `<div class="card stack" style="margin-top:12px;background:#f7faff"><b>${i+1}. ${esc(r.file)}</b><label>Sigortalı adı soyadı<input value="${esc(r.name)}" oninput="uploadRows[${i}].name=this.value" placeholder="PDF'den doğrulanacak"></label><label>Poliçe türü<select onchange="uploadRows[${i}].type=this.value">${types.map(x=>`<option ${x===r.type?'selected':''}>${x}</option>`).join('')}</select></label><label>Poliçe tutarı (TL)<input type="number" min="0" value="${esc(r.amount)}" oninput="uploadRows[${i}].amount=this.value"></label><label>Başlangıç<input type="date" value="${r.start}" onchange="uploadRows[${i}].start=this.value"></label><label>Bitiş<input type="date" value="${r.end}" onchange="uploadRows[${i}].end=this.value"></label></div>`}function saveUploads(){let owner=document.getElementById('owner').value,agency=document.getElementById('agency').value,follow=document.getElementById('follow').value;if(!owner||!agency)return alert('Poliçe kimin ve hangi acente alanları zorunludur.');if(uploadRows.some(r=>!r.name.trim()||!r.amount||!r.start||!r.end))return alert('Her poliçe için ad soyad, tutar ve tarihleri doldurun.');uploadRows.forEach(r=>data.push({id:Date.now()+Math.floor(Math.random()*1e6),name:r.name,type:r.type,amount:+r.amount,start:r.start,end:r.end,agency,owner,uploader:owner,status:'Aktif',follow:follow==='yes'}));save();uploadRows=[];alert('Demo kayıtları bu tarayıcıya eklendi. PDF dosyalarının kendisi saklanmadı.');go('summary')}
function renew(){let rows=data.filter(p=>p.follow&&days(p.end)>=0&&days(p.end)<=15&&!['Poliçeleştirildi','Kaybedildi'].includes(p.status)).sort((a,b)=>days(a.end)-days(b.end));return `<h2>Vade Takibi</h2><div class="note">Kural: Vade bitimine 15, 7 ve 1 gün kala hatırlatma. Poliçeleştirildi/Kaybedildi durumunda sonraki hatırlatmalar durur. Bu demoda gerçek push bildirimi gönderilmez.</div><div class="card" style="margin-top:14px"><h3>Yaklaşan yenilemeler · ${rows.length}</h3>${rows.map(p=>`<div class="item"><div class="row"><b>${esc(p.name)}</b><span class="pill">${days(p.end)} gün kaldı</span></div><div class="muted">${esc(p.type)} · ${esc(p.owner)} · ${esc(p.end)}</div><label style="margin-top:8px">Durum<select onchange="changeStatus(${p.id},this.value)">${['Aktif',...statuses].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></label></div>`).join('')||'<p class="muted">Yaklaşan yenileme bulunmuyor.</p>'}</div>`}
document.body.dataset.theme=localStorage.getItem('policem_v2_theme')||'blue';render();
</script></body></html>
